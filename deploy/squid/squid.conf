# Egress allowlist proxy (Squid), the only container with a route to the internet besides caddy.
# Mounted read-only at /etc/hdt-squid by docker-compose.yml into two instances: `egress-proxy` (net_proxy,
# trading services) and `egress-fetch` (net_fetch, the article fetcher only), so the fetcher never shares
# a network with a trading service or its proxy.
#
# Policy:
# - every client has its own destination allowlist (allowlist/<client>.txt), matched on the requested
#   host name; anything else is denied;
# - trading services may only open CONNECT tunnels to port 443 (HTTPS / WSS); only the fetcher may also
#   send plain http:// GETs, and only to port 80;
# - destinations that resolve to loopback, private, link-local, CGNAT, metadata, documentation
#   (TEST-NET-1/2) or reserved addresses, or into an IPv6 range embedding an IPv4 address (NAT64, 6to4,
#   Teredo; Squid already reads an IPv4-mapped address as its IPv4 address), are denied for everyone; for
#   the fetcher this is the address authority, since on net_fetch it normally cannot resolve names itself
#   (services/fetcher/guard.py `check_address` refuses these ranges too). TEST-NET-3 (203.0.113.0/24)
#   stays out: tests/integration/test_public_isolation.py stands in for a public server there;
# - destinations given as an IP literal are denied for everyone, and every allowlist is matched with
#   `dstdomain -n` (the requested name only, never a reverse DNS lookup): otherwise CONNECT to a public IP
#   whose PTR record, controlled by the owner of that IP, names an allowlisted domain would pass;
# - nothing is cached and client addresses are never forwarded.
# Client IPs must match the ipv4_address values of net_proxy / net_fetch in docker-compose.yml
# (tests/integration/test_public_isolation.py checks both files agree).

http_port 3128
visible_hostname egress-proxy
pid_filename none
coredump_dir none
netdb_filename none
cache deny all
cache_mem 0 MB
forwarded_for delete
httpd_suppress_version_string on
connect_timeout 20 seconds
read_timeout 30 minutes
request_timeout 30 seconds
shutdown_lifetime 5 seconds

logformat hdt %ts.%03tu client=%>a status=%Ss/%03>Hs method=%rm url=%ru dest=%<a bytes=%<st
access_log stdio:/dev/stdout hdt
cache_log stdio:/dev/stderr
logfile_rotate 0

acl CONNECT method CONNECT
acl GET method GET
acl port_https port 443
acl port_http port 80
# Host given as an IPv4 literal (dotted, or a single decimal / hex number) or an IPv6 literal (contains ':').
acl to_ip_literal dstdom_regex -n ^[0-9.]+$ ^0[xX][0-9a-fA-F.xX]*$ :
acl to_private dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 224.0.0.0/3 ::/128 ::1/128 64:ff9b::/96 64:ff9b:1::/48 100::/64 2001::/32 2001:db8::/32 2002::/16 fc00::/7 fe80::/10

# Clients: fixed addresses on net_proxy (egress-proxy) and on net_fetch (egress-fetch, fetcher only).
acl client_recorder src 10.231.11.10
acl client_council src 10.231.11.11
acl client_news src 10.231.11.12
acl client_veto_scan src 10.231.11.13
acl client_scorer src 10.231.11.14
acl client_execution src 10.231.11.15
acl client_telegram src 10.231.11.16
acl client_backup src 10.231.11.17
acl client_testnet_driver src 10.231.11.18
acl client_alertmanager src 10.231.11.19
acl client_blackbox src 10.231.11.20
acl client_fetcher src 10.231.12.10

acl dst_recorder dstdomain -n "/etc/hdt-squid/allowlist/recorder.txt"
acl dst_llm dstdomain -n "/etc/hdt-squid/allowlist/llm.txt"
acl dst_news dstdomain -n "/etc/hdt-squid/allowlist/news.txt"
acl dst_execution dstdomain -n "/etc/hdt-squid/allowlist/execution.txt"
acl dst_telegram dstdomain -n "/etc/hdt-squid/allowlist/telegram.txt"
acl dst_testnet_driver dstdomain -n "/etc/hdt-squid/allowlist/testnet_driver.txt"
acl dst_deadman dstdomain -n "/etc/hdt-squid/allowlist/deadman.txt"
acl dst_fetcher dstdomain -n "/etc/hdt-squid/allowlist/fetcher.txt"
# Rendered at container start from HDT_BACKUP_S3_ENDPOINT (services/egress-proxy/entrypoint.sh).
acl dst_backup dstdomain -n "/run/hdt-squid/backup.txt"

# The prober only checks that Squid answers and denies (no destination lookup, nothing leaves the host).
http_access deny client_blackbox
http_access deny to_ip_literal
http_access deny to_private
# Trading services: HTTPS / WSS tunnels only.
http_access deny !client_fetcher !CONNECT
http_access deny CONNECT !port_https
# Fetcher: CONNECT to 443 or a plain GET to 80.
http_access deny client_fetcher !CONNECT !GET
http_access deny client_fetcher GET !port_http

http_access allow client_recorder dst_recorder
http_access allow client_council dst_llm
http_access allow client_scorer dst_llm
http_access allow client_news dst_llm
http_access allow client_news dst_news
http_access allow client_veto_scan dst_llm
http_access allow client_veto_scan dst_news
http_access allow client_execution dst_execution
http_access allow client_telegram dst_telegram
http_access allow client_testnet_driver dst_testnet_driver
http_access allow client_alertmanager dst_deadman
http_access allow client_backup dst_backup
http_access allow client_fetcher dst_fetcher
http_access deny all

